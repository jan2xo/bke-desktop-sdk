name: BKE.Updater

on:
  push:
    paths:
      - 'src/BKE.Updater/**'
      - 'tests/BKE.Updater.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/updater.yml'
  pull_request:
    paths:
      - 'src/BKE.Updater/**'
      - 'tests/BKE.Updater.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore src/BKE.Updater/BKE.Updater.csproj
      - run: dotnet build src/BKE.Updater/BKE.Updater.csproj --configuration Release --no-restore
      - run: dotnet test tests/BKE.Updater.Tests/BKE.Updater.Tests.csproj --configuration Release
      - run: dotnet pack src/BKE.Updater/BKE.Updater.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: BKE.Updater-0.3.0
          path: artifacts/BKE.Updater.0.3.0.nupkg
          if-no-files-found: error
