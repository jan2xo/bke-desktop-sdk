name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: { dotnet-version: '8.0.x' }
    - run: dotnet restore BKE.Desktop.SDK.sln
    - run: dotnet build BKE.Desktop.SDK.sln --configuration Release --no-restore
    - run: dotnet test BKE.Desktop.SDK.sln --configuration Release --no-build
    - run: dotnet pack src/BKE.Desktop.Client/BKE.Desktop.Client.csproj --configuration Release --no-build --output artifacts
    - name: Verify package
      shell: bash
      run: |
        set -euo pipefail
        test -f artifacts/BKE.Desktop.Client.1.0.0.nupkg
        unzip -l artifacts/BKE.Desktop.Client.1.0.0.nupkg | grep README.md
        unzip -l artifacts/BKE.Desktop.Client.1.0.0.nupkg | grep BKE.Desktop.Client.dll
        unzip -p artifacts/BKE.Desktop.Client.1.0.0.nupkg BKE.Desktop.Client.nuspec | grep 1.0.0